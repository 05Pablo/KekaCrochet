function cerrar() { V.hoja = null; $('velo').hidden = true; $('cuerpo').innerHTML = ''; }
function confirmar(titulo, texto, accion, boton, id) {
  hoja(titulo, '<p>' + esc(texto) + '</p><button class="grande rojo" data-act="' + accion + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + '>' + esc(boton) + '</button><button class="grande sec" data-act="cerrar">Cancelar</button>');
}
function abrirEditor(d, ro) { V.d = d; V.ro = !!ro; V.sucio = false; U.tab = 'esq'; U.v = 0; U.b = -1; U.cb = null; U.ck = null; U.modo = 'vuelta'; U.vista = ro ? 'tej' : 'sim'; ir('diseno'); }
function hojaCompartir() {
  var d = V.d, am = amigas(), ya = {};
  S.cache.compartidos.forEach(function (c) { if (c.diseno === d.id && c.de === yo()) ya[c.para] = 1; });
  hoja('Compartir «' + d.nombre + '»', am.length ? '<p class="nota">Tu amiga lo verá en «Compartidos conmigo» y podrá guardarse una copia. No puede cambiar el tuyo.</p>' + am.map(function (a) {
    return '<div class="persona"><span>' + esc(nombreDe(a.id)) + '</span><button class="' + (ya[a.id] ? 'sec' : '') + '" data-act="' + (ya[a.id] ? 'nocompartir' : 'sicompartir') + '" data-id="' + esc(a.id) + '">' + (ya[a.id] ? 'Dejar de compartir' : 'Compartir') + '</button></div>'; }).join('')
    : '<p>Todavía no tienes amigas. Añádelas en la pestaña «Amigas» con su código.</p>');
}

// ---- Acciones ----
var ACT = {
  inicio: function () { ir('inicio'); cargarNube(); }, amigas: function () { ir('amigas'); cargarNube(); }, perfil: function () { CF.nombre = ''; ir('perfil'); },
  cerrar: cerrar,
  nuevo: function () { abrirEditor({ id: null, nombre: '', vueltas: [], publico: false }, false); },
  abrir: function (d) {
    var x = buscar(d.id); if (!x) return;
    var mio = esLocal(x) || (yo() && x.owner === yo());
    V.de = mio ? '' : (x.publico ? 'De la biblioteca' : 'Compartido por ' + nombreDe(x.owner));
    V.dejar = !mio && !x.publico;
    abrirEditor({ id: x.id, nombre: x.nombre, vueltas: sanear(x.vueltas), publico: x.publico, owner: x.owner }, !mio);
  },
  volver: function () { if (!V.ro && V.sucio) confirmar('¿Salir sin guardar?', 'Se perderán los cambios de este diseño.', 'descartar', 'Salir sin guardar'); else ACT.descartar(); },
  descartar: function () { cerrar(); V.d = null; ir('inicio'); },
  copiar: function () { var o = V.d; abrirEditor({ id: null, nombre: (o.nombre + ' (copia)').slice(0, 80), vueltas: sanear(o.vueltas), publico: false }, false); V.sucio = true; toast('Es una copia tuya: cámbiala y pulsa Guardar'); },
  dejar: async function () {
    try { await api('/rest/v1/compartidos?diseno=eq.' + encodeURIComponent(V.d.id) + '&para=eq.' + encodeURIComponent(yo()), { method: 'DELETE' }); V.d = null; await cargarNube(); ir('inicio'); }
    catch (e) { toast(errTxt(e)); }
  },
  tab: function (d) { U.tab = d.t; U.b = -1; U.cb = null; U.ck = null; render(); },
  vista: function (d) { U.vista = d.t; render(); },
  primera: function () { nuevaVuelta(0); render(); },
  ejemplo: function () { V.d.vueltas = ejemplo(); U.v = 0; U.b = -1; V.sucio = true; render(); },
  irv: function (d) { U.v = +d.i; U.b = -1; U.cb = null; U.ck = null; render(); },
  otra: function () { nuevaVuelta(VS().length); render(); },
  cerrarv: function () { if (U.v === VS().length - 1) nuevaVuelta(VS().length); else { U.v++; U.b = -1; } render(); },
  insertar: function () { nuevaVuelta(U.v); render(); },
  quitarv: function () { VS().splice(U.v, 1); U.b = -1; U.v = Math.max(0, Math.min(U.v, VS().length - 1)); V.sucio = true; render(); },
  forma: function (d) { var v = vu(); if (v.forma === d.t) return; v.forma = d.t; if (d.t === 'c' && v.rep === 1) v.rep = 4; V.sucio = true; render(); },
  addp: function (d) { if (!PT[d.p]) return; var v = vu(); if (v.bloques.length >= 60) { toast('Como mucho 60 conjuntos por vuelta'); return; } v.bloques.push(B(d.p, 1)); U.b = v.bloques.length - 1; estructura(); render(); },
  selb: function (d) { U.b = U.b === +d.i ? -1 : +d.i; render(); },
  mas: function (d) { var b = vu().bloques[+d.i]; b.n = Math.min(200, b.n + 1); estructura(); render(); },
  menos: function (d) { var b = vu().bloques[+d.i]; b.n = Math.max(1, b.n - 1); estructura(); render(); },
  subir: function (d) { var a = vu().bloques, i = +d.i; if (i > 0) { a.splice(i - 1, 0, a.splice(i, 1)[0]); U.b = i - 1; estructura(); render(); } },
  bajar: function (d) { var a = vu().bloques, i = +d.i; if (i < a.length - 1) { a.splice(i + 1, 0, a.splice(i, 1)[0]); U.b = i + 1; estructura(); render(); } },
  dup: function (d) { var a = vu().bloques, i = +d.i, o = a[i]; if (a.length >= 60) return; a.splice(i + 1, 0, B(o.p, o.n, { junto: o.junto, color: o.color })); U.b = i + 1; estructura(); render(); },
  quitarb: function (d) { vu().bloques.splice(+d.i, 1); U.b = -1; estructura(); render(); },
  repmas: function () { var v = vu(); v.rep = Math.min(200, v.rep + 1); estructura(); render(); },
  repmenos: function () { var v = vu(); v.rep = Math.max(1, v.rep - 1); estructura(); render(); },
  modo: function (d) { U.modo = d.t; U.ck = null; if (d.t === 'vuelta') U.cb = null; render(); },
  gama: function (d) { U.gama = d.t; render(); },
  color: function (d) { if (ponerColor(d.c)) render(); },
  hex: function () { var x = $('hx').value.trim(); if (x && x[0] !== '#') x = '#' + x; if (ponerColor(x)) render(); else { toast('Escribe un código como #A1B2C3'); $('hx').focus(); } },
  quitarcolor: function () { var v = vu(); if (U.modo === 'conjunto' && v.bloques[U.cb]) v.bloques[U.cb].color = null; if (U.modo === 'punto' && U.ck != null) delete v.puntos[U.ck]; V.sucio = true; render(); },
  guardardiseno: async function () {
    var d = V.d, nombre = d.nombre.trim();
    if (!nombre) { toast('Ponle un nombre al diseño'); return; }
    if (!d.vueltas.some(function (v) { return v.bloques.length; })) { toast('Añade al menos una vuelta con puntos'); return; }
    var vs = sanear(d.vueltas);
    V.ocupado = true; render();
    try {
      if (NUBE && S.ses) {
        var cuerpo = { nombre: nombre.slice(0, 80), datos: { vueltas: vs }, publico: esAdmin() && !!d.publico };
        if (d.id && !esLocal(d)) { cuerpo.actualizado = new Date().toISOString(); await api('/rest/v1/disenos?id=eq.' + encodeURIComponent(d.id), { method: 'PATCH', body: cuerpo }); }
        else { var vieja = d.id; d.id = (await api('/rest/v1/disenos?select=id', { method: 'POST', prefer: 'return=representation', body: cuerpo }))[0].id; if (vieja) { S.locales = S.locales.filter(function (x) { return x.id !== vieja; }); guardar(); } }
        V.ocupado = false; V.sucio = false; await cargarNube();
      } else {
        if (!d.id) d.id = 'loc-' + nuevoId();
        S.locales = S.locales.filter(function (x) { return x.id !== d.id; }); S.locales.unshift({ id: d.id, nombre: nombre.slice(0, 80), vueltas: vs, mod: new Date().toISOString() }); guardar();
        V.ocupado = false; V.sucio = false;
      }
      render(); toast(S.ses ? 'Diseño guardado' : 'Guardado en este dispositivo');
    } catch (e) { V.ocupado = false; render(); toast('No se ha podido guardar: ' + errTxt(e)); }
  },
  pedirborrar: function () { confirmar('¿Eliminar este diseño?', 'No se puede deshacer. Si lo habías compartido, tus amigas dejarán de verlo.', 'borrardiseno', 'Eliminar'); },
  borrardiseno: async function () {
    var id = V.d.id; cerrar();
    try {
      if (esLocal(V.d)) { S.locales = S.locales.filter(function (x) { return x.id !== id; }); guardar(); }
      else { await api('/rest/v1/disenos?id=eq.' + encodeURIComponent(id), { method: 'DELETE' }); await cargarNube(); }
      V.d = null; ir('inicio'); toast('Diseño eliminado');
    } catch (e) { toast('No se ha podido eliminar: ' + errTxt(e)); }
  },
  compartir: function () {
    if (!S.ses) { toast('Para compartir necesitas entrar con tu cuenta (pestaña Perfil)'); return; }
    if (V.sucio || esLocal(V.d)) { toast('Guarda antes el diseño'); return; }
    hojaCompartir();
  },
  sicompartir: async function (d) { try { await api('/rest/v1/compartidos', { method: 'POST', body: { diseno: V.d.id, para: d.id } }); await cargarNube(); hojaCompartir(); toast('Compartido con ' + nombreDe(d.id)); } catch (e) { toast('No se ha podido compartir: ' + errTxt(e)); } },
  nocompartir: async function (d) { try { await api('/rest/v1/compartidos?diseno=eq.' + encodeURIComponent(V.d.id) + '&para=eq.' + encodeURIComponent(d.id), { method: 'DELETE' }); await cargarNube(); hojaCompartir(); } catch (e) { toast(errTxt(e)); } },
  copiarcod: function () { var c = $('micod').textContent; try { navigator.clipboard.writeText(c).then(function () { toast('Código copiado'); }, function () { toast('Tu código es ' + c); }); } catch (e) { toast('Tu código es ' + c); } },
  pediramiga: async function () {
    var c = CF.cod.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 4) { toast('Escribe el código de tu amiga'); return; }
    V.ocupado = true; render();
    try {
      var r = await api('/rest/v1/rpc/pedir_amistad', { method: 'POST', body: { cod: c } });
      var m = { ok: 'Solicitud enviada', no_existe: 'No hay nadie con ese código', tu_misma: 'Ese es tu propio código', ya: 'Ya sois amigas o hay una solicitud pendiente' }[r] || 'Solicitud enviada';
      if (r === 'ok') CF.cod = ''; toast(m); await cargarNube();
    } catch (e) { toast(errTxt(e)); }
    V.ocupado = false; render();
  },
  aceptar: async function (d) { try { await api('/rest/v1/amistades?id=eq.' + encodeURIComponent(d.id), { method: 'PATCH', body: { estado: 'aceptada' } }); await cargarNube(); toast('Ya sois amigas'); } catch (e) { toast(errTxt(e)); } },
  pedirquitar: function (d) { confirmar('¿Quitar a esta amiga?', 'Dejaréis de ver los diseños que os hayáis compartido.', 'quitaramiga', 'Quitar', d.id); },
  quitaramiga: async function (d) { cerrar(); try { await api('/rest/v1/amistades?id=eq.' + encodeURIComponent(d.id), { method: 'DELETE' }); await cargarNube(); } catch (e) { toast(errTxt(e)); } },
  entrar: function () { return acceso(false); }, crearcuenta: function () { return acceso(true); },
  guardarnombre: async function () {
    var n = CF.nombre.trim().slice(0, 40); if (!n) { toast('Escribe tu nombre'); return; }
    try { await api('/rest/v1/perfiles?id=eq.' + encodeURIComponent(yo()), { method: 'PATCH', body: { nombre: n } }); CF.nombre = ''; await cargarNube(); toast('Nombre guardado'); } catch (e) { toast(errTxt(e)); }
  },
  salir: async function () { try { await api('/auth/v1/logout', { method: 'POST' }); } catch (e) {} quitarSesion(); render(); toast('Sesión cerrada'); cargarNube(); },
  pedirborrarcuenta: function () { confirmar('¿Eliminar tu cuenta?', 'Se borrarán tu cuenta, tus diseños de la nube y tus amistades. No se puede deshacer.', 'borrarcuenta', 'Eliminar mi cuenta'); },
  borrarcuenta: async function () { cerrar(); try { await api('/rest/v1/rpc/eliminar_mi_cuenta', { method: 'POST', body: {} }); quitarSesion(); render(); toast('Cuenta eliminada'); cargarNube(); } catch (e) { toast('No se ha podido eliminar la cuenta: ' + errTxt(e)); } }
};
async function acceso(alta) {
  var email = CF.email.trim(), nombre = CF.nombre.trim().slice(0, 40);
  if (!/^\S+@\S+\.\S+$/.test(email) || CF.pass.length < 6) { toast('Escribe tu correo y una contraseña de 6 caracteres o más'); return; }
  if (alta && !nombre) { toast('Escribe tu nombre para crear la cuenta'); return; }
  V.ocupado = true; render();
  try {
    var cuerpo = { email: email, password: CF.pass }; if (alta) cuerpo.data = { nombre: nombre };
    var r = await fetch(SUPA_URL + '/auth/v1/' + (alta ? 'signup' : 'token?grant_type=password'), { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('Error ' + r.status));
    if (j.access_token) { ponerSesion(j); CF.pass = ''; CF.nombre = ''; await trasEntrar(); toast('Sesión iniciada'); }
    else toast('Cuenta creada. Confirma el correo que te ha llegado y luego pulsa Entrar');
  } catch (err) {
    var m = errTxt(err);
    toast(/invalid login/i.test(m) ? 'Correo o contraseña incorrectos' : /not confirmed/i.test(m) ? 'Antes tienes que confirmar el correo que te enviamos' : /already registered/i.test(m) ? 'Ya hay una cuenta con ese correo' : m);
  }
  V.ocupado = false; render();
}
async function trasEntrar() {
  try { await subirLocales(); } catch (e) { toast('Has entrado, pero algún diseño no se ha podido subir'); }
  await cargarNube();
}
// Al volver del enlace del correo de confirmación, Supabase deja la sesión en la dirección
async function sesionDeEnlace() {
  var h = location.hash || ''; if (h.indexOf('access_token=') < 0) return;
  var p = new URLSearchParams(h.slice(1)), at = p.get('access_token'), rt = p.get('refresh_token');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!at || !rt || !NUBE) return;
  try {
    var r = await fetch(SUPA_URL + '/auth/v1/user', { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + at } });
    if (!r.ok) return; var u = await r.json(); if (!u || !u.id) return;
    ponerSesion({ access_token: at, refresh_token: rt, expires_in: +p.get('expires_in') || 3600, user: u }); await trasEntrar(); toast('Cuenta confirmada. Ya has entrado.');
  } catch (e) {}
}

document.addEventListener('click', function (e) {
  if (e.target.id === 'velo') { cerrar(); return; }
  var p = e.target.closest && e.target.closest('#lienzo .pt');
  if (p && V.vista === 'diseno' && !V.ro) {
    U.v = +p.dataset.v;
    if (U.tab === 'esq') U.b = +p.dataset.b; else { U.cb = +p.dataset.b; U.ck = U.modo === 'punto' ? +p.dataset.k : null; }
    render(); return;
  }
  var b = e.target.closest && e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset);
});
document.addEventListener('input', function (e) {
  var c = e.target.dataset && e.target.dataset.campo;
  if (c === 'nombre' && V.d) { V.d.nombre = e.target.value; V.sucio = true; }
  else if (c === 'email') CF.email = e.target.value; else if (c === 'pass') CF.pass = e.target.value;
  else if (c === 'nombreu') CF.nombre = e.target.value; else if (c === 'cod') CF.cod = e.target.value;
});
document.addEventListener('change', function (e) {
  var c = e.target.dataset && e.target.dataset.campo; if (!c || !V.d || V.vista !== 'diseno' || V.ro) return;
  if (c === 'publico') { V.d.publico = e.target.checked; V.sucio = true; return; }
  var v = vu(); if (!v) return;
  if (c === 'n') { v.bloques[+e.target.dataset.i].n = Math.min(200, Math.max(1, parseInt(e.target.value, 10) || 1)); estructura(); }
  else if (c === 'rep') { v.rep = Math.min(200, Math.max(1, parseInt(e.target.value, 10) || 1)); estructura(); }
  else if (c === 'junto') { v.bloques[+e.target.dataset.i].junto = e.target.checked; V.sucio = true; }
  else if (c === 'esq') { v.bloques.forEach(function (b, i) { b.esq = i === +e.target.dataset.i ? e.target.checked : false; }); V.sucio = true; }
  else if (c === 'pick') ponerColor(e.target.value);
  else return;
  render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && V.hoja) cerrar(); if (e.key === 'Enter' && e.target.id === 'hx') ACT.hex(); });

S.locales = (Array.isArray(S.locales) ? S.locales : []).map(function (x) { var d = disenoLimpio(x); return { id: d.id, nombre: d.nombre, vueltas: d.vueltas, mod: d.mod }; }).filter(esLocal);
S.cache = { disenos: (S.cache.disenos || []).map(disenoLimpio), perfiles: S.cache.perfiles || [], amistades: S.cache.amistades || [], compartidos: S.cache.compartidos || [] };
render();
sesionDeEnlace().then(cargarNube);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
