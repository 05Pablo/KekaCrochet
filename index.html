<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grannys</title>
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grannys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--fondo:#f6efe4;--tinta:#3b2f2a;--suave:#8a7a70;--tarjeta:#fffaf2;--borde:#e4d8c6;--acento:#c8553d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font:italic 1.6rem Georgia,'Times New Roman',serif;margin:6px 0 2px}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:20px 0 8px}
p{line-height:1.45}
.sub,.vacio{color:var(--suave);font-size:.9rem;margin:0 0 6px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.barra{display:flex;align-items:center;gap:8px;min-height:44px}
.barra strong{flex:1;min-width:0;font:italic 1.25rem Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra button{flex:none;background:none;border:0;font-size:.92rem;font-weight:700;color:var(--acento);padding:10px 6px}
.rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tarjeta{background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:16px;padding:10px;text-align:left;display:block;width:100%}
.tarjeta .mini{line-height:0;margin-bottom:8px}
.tarjeta svg{display:block;width:100%;height:auto}
.tarjeta b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta small{color:var(--suave);font-size:.78rem}
.tarjeta.nueva{border-style:dashed;border-color:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;font-weight:700;gap:6px;text-align:center}
.tarjeta.nueva span{font-size:1.8rem;line-height:1}
.visor{position:sticky;top:0;z-index:2;background:var(--fondo);padding:8px 0 10px}
#lienzo{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:10px;line-height:0;width:min(100%,42vh);margin:0 auto}
#lienzo svg{display:block;width:100%;height:auto}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fila{background:var(--tarjeta);border:2px solid var(--borde);border-radius:14px;overflow:hidden}
.fila.sel{border-color:var(--acento)}
.cab{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;text-align:left;font-size:.9rem}
.cab i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.cab span{flex:1;min-width:0;color:var(--suave)}
.cab b{display:block;color:var(--tinta);font-size:.9rem}
.cab svg{flex:none;color:var(--suave)}
.det{padding:2px 12px 12px}
.paleta{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.paleta button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0}
.paleta button[aria-pressed=true]{outline:3px solid var(--acento);outline-offset:2px}
.otro{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;margin-top:10px}
.otro input{width:38px;height:30px;padding:0;border:1px solid var(--borde);border-radius:8px;background:none}
.mini2,.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mini2 button,.acc button{flex:1;font-size:.84rem;font-weight:600;background:none;border:1.5px solid var(--tinta);border-radius:999px;padding:9px 12px;white-space:nowrap}
.mini2 button{border-color:var(--borde)}
.grande{display:block;width:100%;margin-top:12px;font-size:1rem;font-weight:700;background:var(--acento);color:#fff;border:0;border-radius:14px;padding:14px}
.grande.sec{background:none;color:var(--tinta);border:1.5px solid var(--tinta)}
.grande.rojo{background:none;color:#a3261d;border:1.5px solid #a3261d}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.chips button{flex:none;font-size:.84rem;font-weight:600;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:999px;padding:8px 13px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.chips button.mas{border-style:dashed;border-color:var(--tinta)}
.nota{font-size:.82rem;color:var(--suave);margin:4px 2px 0}
.nota button{background:none;border:0;padding:0;font-size:inherit;color:var(--acento);font-weight:700;text-decoration:underline}
.combos{display:grid;gap:6px}
.combo{display:flex;align-items:center;gap:8px;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:12px;padding:4px 4px 4px 10px}
.combo .tira{flex:1;display:flex;gap:4px;flex-wrap:wrap;background:none;border:0;padding:8px 0}
.tira i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.combo .x{flex:none;background:none;border:0;font-size:1rem;padding:10px;color:var(--suave)}
.bloque{background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:10px}
.bloque b{display:block;margin-bottom:4px}
.bloque p{margin:0 0 10px;font-size:.86rem;color:var(--suave)}
label.campo{display:block;font-size:.8rem;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--tinta)}
input[type=file]{max-width:100%;font-size:.86rem;margin-top:6px}
.marca{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin-top:14px}
.marca input{width:22px;height:22px;flex:none;margin:0}
.fotoesq{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--borde);margin:6px 0}
.aviso{font-size:.86rem;background:#fdeacc;border-radius:10px;padding:10px;margin:8px 0 0}
#velo{position:fixed;inset:0;background:rgba(40,28,22,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#velo[hidden]{display:none}
#hoja{background:var(--fondo);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom))}
.tipos{display:grid;gap:8px}
.tipos button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:14px;padding:10px 12px}
.tipos button svg{flex:none}
.tipos b{display:block;font-size:.95rem}
.tipos small{color:var(--suave);font-size:.8rem}
#foto{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--borde);margin:8px 0;touch-action:manipulation;cursor:crosshair}
#hoja img.orig{display:block;width:100%;height:auto;border-radius:10px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--tarjeta);border-top:1px solid var(--borde);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav[hidden]{display:none}
#nav button{flex:1;max-width:280px;background:none;border:0;padding:14px 8px;font-size:.9rem;font-weight:700;color:var(--suave)}
#nav button[aria-current=page]{color:var(--acento)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:88vw;text-align:center}
#toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Secciones"><button id="nb" data-act="inicio">Biblioteca</button><button id="np" data-act="perfil">Perfil</button></nav>
<div id="velo" hidden><div id="hoja" role="dialog" aria-modal="true" aria-labelledby="htit">
  <div class="barra"><strong id="htit"></strong><button data-act="cerrar">Cerrar</button></div><div id="cuerpo"></div></div></div>
<div id="toast" role="status" hidden></div>
<script>
// ====== CONEXIÓN CON SUPABASE ======
// Pega aquí la "Project URL" y la clave "anon / publishable" (NUNCA la service_role).
// Si se dejan vacías, la app funciona igual pero todo se guarda solo en el dispositivo.
var SUPA_URL = '';
var SUPA_KEY = '';
// ===================================
// Motor: a partir de una lista de TIPOS de vuelta calcula los puntos y dibuja el granny tejido.
var PESO = { pa: 1, pma: 1, pb: 0.9, ch: 0.8, sp: 0.55 };
function rep(arr, n) { var o = []; for (var i = 0; i < n; i++) o = o.concat(arr); return o; }

var TIPOS = [
  { id: 'pa', nombre: 'Puntos altos', desc: 'Todos seguidos, uno al lado de otro', h: 0.75, ic: ['pa', 'pa', 'pa', 'pa', 'pa'] },
  { id: 'pa_ch', nombre: 'Punto alto + cadeneta', desc: 'Un punto alto, una cadeneta, y se repite', h: 0.75, ic: ['pa', 'ch', 'pa', 'ch', 'pa'] },
  { id: 'pa2_ch', nombre: '2 puntos altos + cadeneta', desc: 'Parejas de puntos altos separadas por una cadeneta', h: 0.75, ic: ['pa', 'pa', 'ch', 'pa', 'pa'] },
  { id: 'g3', nombre: 'Grupos de 3 puntos altos', desc: 'Grupitos de 3 con un hueco entre ellos', h: 0.8, ic: ['pa', 'pa', 'pa', 'sp', 'pa', 'pa', 'pa'] },
  { id: 'cuadrar', nombre: 'Cuadrar el círculo', desc: 'La vuelta que saca las cuatro esquinas', h: 0.85, cuadra: true },
  { id: 'clasico', nombre: 'Granny clásico', desc: 'Grupos de 3 con cadenetas en las esquinas', h: 0.8, cuadra: true, ic: ['ch', 'pa', 'pa', 'pa', 'ch'] },
  { id: 'arcos', nombre: 'Arcos de cadenetas', desc: 'Punto bajo y un arco de 3 cadenetas', h: 0.55, ic: ['pb', 'ch', 'ch', 'ch', 'pb'] },
  { id: 'pma', nombre: 'Medios altos', desc: 'Vuelta más bajita, típica de borde', h: 0.6, ic: ['pma', 'pma', 'pma', 'pma', 'pma'] },
  { id: 'pb', nombre: 'Puntos bajos', desc: 'El borde más fino', h: 0.4, ic: ['pb', 'pb', 'pb', 'pb', 'pb'] }
];
var TIPO = {}; TIPOS.forEach(function (t) { TIPO[t.id] = t; });

// De la lista de tipos saca la geometría: la app decide cuántos puntos caben, los aumentos y las esquinas.
function generar(ids) {
  var r = 0.3, c = 0, out = [];
  ids.forEach(function (id) {
    var T = TIPO[id], r1 = r + T.h, c1;
    if (T.cuadra && c < 0.5) c1 = id === 'clasico' ? 0.9 : 0.86;
    else c1 = c > 0 ? Math.min(0.96, c + (1 - c) * 0.45) : 0;
    var largo = (Math.PI / 2 * r1) * (1 - c1) + 2 * r1 * c1, u = largo / 0.4;
    var esq = c1 > 0.5, disp = u - (esq ? 1.6 : 0), lado, k;
    function reps(unidad) {
      var w = unidad.reduce(function (s, x) { return s + PESO[x]; }, 0);
      return rep(unidad, Math.max(1, Math.round(disp / w)));
    }
    if (id === 'cuadrar' && c < 0.5) {
      k = Math.max(1, Math.round((u - 5.2) / 3.2));
      lado = ['ch', 'pa'];
      for (var j = 0; j < k; j++) lado.push('ch', 'ch', 'pma');
      lado.push('ch', 'ch', 'pa', 'ch');
    } else {
      if (id === 'pa' || id === 'pma' || id === 'pb') lado = reps([id]);
      else if (id === 'pa_ch') lado = reps(['pa', 'ch']);
      else if (id === 'pa2_ch') lado = reps(['pa', 'pa', 'ch']);
      else if (id === 'arcos' || id === 'cuadrar') lado = reps(['pb', 'ch', 'ch', 'ch']);
      else {
        k = Math.max(1, Math.round((disp + 0.55) / 3.55)); lado = [];
        for (var g = 0; g < k; g++) { if (g) lado.push('sp'); lado.push('pa', 'pa', 'pa'); }
      }
      if (esq) lado = ['ch'].concat(lado, ['ch']);
    }
    var puntos = lado.filter(function (x) { return x !== 'sp'; }).length * 4;
    out.push({ r0: r, r1: r1, c0: c, c1: c1, lado: lado, puntos: puntos });
    r = r1; c = c1;
  });
  return out;
}

function sombra(hex, f) {
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function m(x) { return Math.round(f < 0 ? x * (1 + f) : x + (255 - x) * f); }
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

function P(r, c, q, t) {
  var a = t * Math.PI / 4;
  var x = r * Math.cos(a) * (1 - c) + r * c, y = r * Math.sin(a) * (1 - c) + r * t * c;
  var g = q * Math.PI / 2, cs = Math.cos(g), sn = Math.sin(g);
  return [x * cs - y * sn, x * sn + y * cs];
}

function dibujarGranny(vueltas, colores) {
  var E = 40, f = function (v) { return (v * E).toFixed(1); };
  var rMax = vueltas.length ? vueltas[vueltas.length - 1].r1 : 0;
  var R = Math.round(Math.max(rMax, 2.6) * E + 12);
  var cab = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (-R) + ' ' + (-R) + ' ' + (2 * R) + ' ' + (2 * R) + '" role="img" aria-label="Vista previa del granny tejido">';
  if (!vueltas.length) {
    return cab + '<circle r="13" fill="none" stroke="#b9a996" stroke-width="3" stroke-dasharray="5 5"/>' +
      '<text y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a7a70">Aquí aparecerá tu granny</text></svg>';
  }
  var out = [];
  vueltas.forEach(function (v, i) {
    var col = colores[i], osc = sombra(col, -0.38), cla = sombra(col, 0.22);
    var total = v.lado.reduce(function (s, k) { return s + PESO[k]; }, 0);
    var largo = (Math.PI / 2 * v.r1) * (1 - v.c1) + 2 * v.r1 * v.c1;
    var paso = largo / total, w = Math.min(paso * 0.82, 0.42);
    var postes = [], cabezas = [];
    for (var q = 0; q < 4; q++) {
      var acc = 0;
      v.lado.forEach(function (k) {
        var t = ((acc + PESO[k] / 2) / total) * 2 - 1; acc += PESO[k];
        if (k === 'sp') return;
        var o = P(v.r1 - 0.1, v.c1, q, t), o2 = P(v.r1 - 0.1, v.c1, q, t + 0.02);
        var ang = Math.atan2(o2[1] - o[1], o2[0] - o[0]) * 180 / Math.PI;
        if (k === 'ch') {
          var cpt = P(v.r1 - 0.14, v.c1, q, t);
          cabezas.push('<g transform="translate(' + f(cpt[0]) + ',' + f(cpt[1]) + ') rotate(' + ang.toFixed(1) + ')">' +
            '<ellipse rx="' + f(paso * 0.62) + '" ry="' + f(0.15) + '" fill="' + col + '" stroke="' + osc + '" stroke-width="1.6"/>' +
            '<path d="M' + f(-paso * 0.3) + ',0 L' + f(paso * 0.3) + ',0" stroke="' + osc + '" stroke-width="1.4" stroke-linecap="round" opacity=".7"/></g>');
          return;
        }
        var b = P(v.r0 - 0.05, v.c0, q, t), a = P(v.r1 - 0.16, v.c1, q, t);
        var dx = a[0] - b[0], dy = a[1] - b[1], L = Math.sqrt(dx * dx + dy * dy), nx = -dy / L, ny = dx / L;
        var d = 'M' + f(b[0]) + ',' + f(b[1]) + ' L' + f(a[0]) + ',' + f(a[1]);
        var s = '<path d="' + d + '" stroke="' + osc + '" stroke-width="' + f(w * 1.18) + '" stroke-linecap="round"/>' +
          '<path d="' + d + '" stroke="' + col + '" stroke-width="' + f(w * 0.9) + '" stroke-linecap="round"/>';
        var n = k === 'pa' ? Math.max(2, Math.round(L / 0.3)) : Math.max(1, Math.round(L / 0.4));
        for (var j = 1; j <= n; j++) {
          var uu = j / (n + 1), cx = b[0] + dx * uu, cy = b[1] + dy * uu, h = w * 0.36;
          var ex = nx * h + dx / L * h * 0.7, ey = ny * h + dy / L * h * 0.7;
          s += '<path d="M' + f(cx - ex) + ',' + f(cy - ey) + ' L' + f(cx + ex) + ',' + f(cy + ey) + '" stroke="' + (j % 2 ? cla : osc) + '" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>';
        }
        postes.push(s);
        cabezas.push('<g transform="translate(' + f(o[0]) + ',' + f(o[1]) + ') rotate(' + ang.toFixed(1) + ')">' +
          '<ellipse rx="' + f(Math.max(paso * 0.62, 0.2)) + '" ry="' + f(0.13) + '" fill="' + col + '" stroke="' + osc + '" stroke-width="1.5"/>' +
          '<path d="M' + f(-paso * 0.3) + ',0 L' + f(paso * 0.3) + ',0" stroke="' + cla + '" stroke-width="1.3" stroke-linecap="round" opacity=".8"/></g>');
      });
    }
    out.push('<g data-vuelta="' + i + '">' + postes.join('') + cabezas.join('') + '</g>');
  });
  return cab + '<g fill="none">' + out.join('') + '</g>' +
    '<circle r="9" fill="none" stroke="' + sombra(colores[0], -0.38) + '" stroke-width="5"/>' +
    '<circle r="9" fill="none" stroke="' + colores[0] + '" stroke-width="3"/></svg>';
}

// Dibujito del tipo de vuelta con los símbolos de los esquemas
function icono(id) {
  var a = '<svg viewBox="0 0 72 30" width="72" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">';
  if (id === 'cuadrar') return a + '<circle cx="14" cy="15" r="9"/><path d="M30 15h10m-4-4 4 4-4 4"/><rect x="48" y="5" width="20" height="20" rx="2"/></svg>';
  var ic = TIPO[id].ic, s = '';
  ic.forEach(function (k, i) {
    var x = (8 + i * 56 / (ic.length - 1)).toFixed(1);
    if (k === 'ch') s += '<ellipse cx="' + x + '" cy="8" rx="4.5" ry="2.6"/>';
    else if (k === 'pb') s += '<path d="M' + x + ' 10v12M' + (x - 4) + ' 16h8"/>';
    else if (k === 'pma') s += '<path d="M' + x + ' 6v19M' + (x - 4) + ' 6h8"/>';
    else if (k === 'pa') s += '<path d="M' + x + ' 6v19M' + (x - 4) + ' 6h8M' + (x - 3.5) + ' 17l7-4"/>';
  });
  return a + s + '</svg>';
}

var SAFRAN = [['Safran 1','#c39598'],['Safran 2','#c05668'],['Safran 4','#678b70'],['Safran 5','#9da2b5'],['Safran 6','#546674'],['Safran 7','#898586'],['Safran 9','#2b3743'],['Safran 10','#c7a45e'],['Safran 11','#d18b35'],['Safran 12','#ce6667'],['Safran 13','#c32d2e'],['Safran 15','#6e093b'],['Safran 16','#19191b'],['Safran 17','#d4d4d6'],['Safran 18','#d0c8b9'],['Safran 19','#ac0a0c'],['Safran 20','#802433'],['Safran 21','#a69180'],['Safran 22','#6f543f'],['Safran 23','#56412b'],['Safran 28','#b94c1f'],['Safran 30','#538d9c'],['Safran 31','#928d46'],['Safran 50','#91a7ae'],['Safran 56','#d5b0a1'],['Safran 57','#a37075'],['Safran 58','#9f8183'],['Safran 59','#91563f'],['Safran 60','#74734f'],['Safran 62','#c3ac5b'],['Safran 63','#6e8077'],['Safran 64','#af9f84'],['Safran 65','#9d9a6c'],['Safran 66','#c79632'],['Safran 67','#bb773f'],['Safran 68','#4a3828'],['Safran 70','#beafc0'],['Safran 71','#e2d8c1'],['Safran 72','#eae6e2'],['Safran 73','#3454a2'],['Safran 74','#bdc7aa'],['Safran 75','#ab4f90'],['Safran 76','#b3d7e3'],['Safran 77','#e2bfc9'],['Safran 78','#4f7144']];
var NUBE = /^https:\/\/.+/.test(SUPA_URL) && !!SUPA_KEY;
var BASICOS = [['Blanco','#ffffff'],['Crudo','#f4efe6'],['Marfil','#ece2cf'],['Arena','#d9c2a3'],['Beige','#c9ad8a'],['Gris perla','#cfcfd2'],['Gris','#8e9096'],['Gris marengo','#5a5d63'],['Antracita','#3a3c42'],['Negro','#1e1e22'],
  ['Vainilla','#f6e7a6'],['Limón','#f2dc4e'],['Amarillo','#f5c518'],['Mostaza','#e0a82e'],['Ocre','#c98a1d'],['Melocotón','#f7c59f'],['Albaricoque','#f4a66a'],['Mandarina','#ee8a3c'],['Naranja','#e86a1c'],['Teja','#c5562c'],
  ['Rosa bebé','#f8d3dc'],['Rosa palo','#e9aeb9'],['Rosa','#e8718d'],['Chicle','#ee5fa0'],['Fucsia','#d6337f'],['Coral','#e8644f'],['Rojo','#d12b2b'],['Cereza','#b01e36'],['Frambuesa','#b8325a'],['Burdeos','#7a1f33'],
  ['Lavanda','#d5c8ee'],['Lila','#b59ad6'],['Malva','#a77bb5'],['Violeta','#7d4fb0'],['Morado','#5b2e86'],['Ciruela','#7a3b63'],['Berenjena','#452445'],
  ['Azul bebé','#cfe3f2'],['Celeste','#8fc1de'],['Azul cielo','#5fa8d8'],['Azul','#3f6fb0'],['Cobalto','#2a4fa3'],['Vaquero','#5b7696'],['Marino','#27365c'],['Petróleo','#1f5f6b'],['Turquesa','#2fb5b0'],['Aguamarina','#8fd6cc'],
  ['Menta','#b9e3cf'],['Verde agua','#7fb7a3'],['Pistacho','#b8cf7a'],['Lima','#a6c636'],['Verde','#4f9e45'],['Salvia','#8a9a6b'],['Oliva','#6f7a35'],['Musgo','#4f6b3a'],['Botella','#2f6b55'],['Verde oscuro','#1f4a36'],
  ['Camel','#c79a63'],['Caramelo','#b0763a'],['Canela','#9a5a34'],['Topo','#8b7b70'],['Chocolate','#6b4433'],['Café','#4a2f25']];
var CICLO = ['#c79632', '#c05668', '#e2d8c1', '#678b70', '#3454a2', '#ce6667'];
var GAMAS_FIJAS = [
  { id: 'basicos', nombre: 'Colores básicos', colores: BASICOS },
  { id: 'safran', nombre: 'DROPS Safran', colores: SAFRAN, nota: 'Tonos aproximados, sacados de la carta de colores de la tienda.' }];
var INCLUIDOS = [
  { id: 'inc-clasico', nombre: 'Granny clásico', vueltas: ['clasico', 'clasico', 'clasico', 'clasico'], colores: ['#c79632', '#c05668', '#e2d8c1', '#678b70'] },
  { id: 'inc-circulo', nombre: 'Círculo a cuadrado', vueltas: ['pa', 'pa_ch', 'pa2_ch', 'cuadrar', 'g3', 'pma'], colores: ['#c79632', '#c05668', '#e2d8c1', '#538d9c', '#3454a2', '#ce6667'] },
  { id: 'inc-flor', nombre: 'Flor en el centro', vueltas: ['pa', 'arcos', 'g3', 'cuadrar', 'pa', 'pb'], colores: ['#c7a45e', '#ab4f90', '#e2bfc9', '#678b70', '#eae6e2', '#678b70'] }];

var CLAVE = 'grannys.v1';
var S = (function () {
  var d = { mios: [], gamas: [], combos: {}, ultimo: {}, gamaActiva: 'basicos', ses: null, pub: { esquemas: [], gamas: [] } };
  try { var j = JSON.parse(localStorage.getItem(CLAVE) || '{}'); for (var k in d) if (j[k] !== undefined && j[k] !== null) d[k] = j[k]; } catch (e) {}
  return d;
})();
var V = { vista: 'inicio', id: null, cols: [], sel: -1, ed: null, hoja: null, fotoGama: null, ocupado: false };
var CF = { email: '', pass: '' };
var FOTOS = {};
var $ = function (id) { return document.getElementById(id); };

function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) { toast('No queda espacio para guardar en este dispositivo'); } }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function okHex(c) { return typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c); }
function hex(r, g, b) { return '#' + [r, g, b].map(function (x) { return ('0' + Math.round(x).toString(16)).slice(-2); }).join(''); }
function nuevoId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function esLocal(x) { return String(x.id).indexOf('loc-') === 0; }
function okFoto(f) { return typeof f === 'string' && /^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(f); }
var tToast = null;
function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tToast); tToast = setTimeout(function () { t.hidden = true; }, 3800); }

// ---- Datos que llegan de fuera: se limpian siempre antes de usarlos ----
function limpio(e) {
  var v = (Array.isArray(e.vueltas) ? e.vueltas : []).filter(function (t) { return typeof t === 'string' && TIPO[t]; }).slice(0, 30);
  var c = v.map(function (_, i) { var x = Array.isArray(e.colores) ? e.colores[i] : null; return okHex(x) ? x.toLowerCase() : CICLO[i % CICLO.length]; });
  return { id: String(e.id), nombre: String(e.nombre || 'Sin nombre').slice(0, 80), vueltas: v, colores: c, publico: !!e.publico, owner: e.owner || null, tiene_foto: !!e.tiene_foto };
}
function gamaLimpia(g) {
  var c = (Array.isArray(g.colores) ? g.colores : []).filter(function (x) { return Array.isArray(x) && okHex(x[1]); }).slice(0, 150)
    .map(function (x) { return [String(x[0]).slice(0, 40), x[1].toLowerCase()]; });
  return { id: String(g.id), nombre: String(g.nombre || 'Gama').slice(0, 40), colores: c, publico: !!g.publico, owner: g.owner || null };
}

// ---- Fotos de los esquemas guardados en el dispositivo (IndexedDB) ----
var DBP = null;
function bd() {
  return DBP || (DBP = new Promise(function (ok, ko) {
    var r = indexedDB.open('grannys', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('fotos'); };
    r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); };
  }));
}
function fotoOp(modo, fn) {
  var op = bd().then(function (d) {
    return new Promise(function (ok, ko) { var t = d.transaction('fotos', modo), q = fn(t.objectStore('fotos')); t.oncomplete = function () { ok(q.result); }; t.onerror = function () { ko(t.error); }; });
  }).catch(function () { return null; });
  // Si el almacén de fotos no responde (navegación privada, etc.), la app no se queda colgada
  return Promise.race([op, new Promise(function (ok) { setTimeout(function () { ok(null); }, 4000); })]);
}
function fotoLeer(id) { return fotoOp('readonly', function (s) { return s.get(id); }); }
function fotoPoner(id, v) { return fotoOp('readwrite', function (s) { return s.put(v, id); }); }
function fotoBorrar(id) { return fotoOp('readwrite', function (s) { return s.delete(id); }); }

// ---- Nube (Supabase) ----
function ponerSesion(j) {
  S.ses = { access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, uid: j.user.id, email: j.user.email, admin: S.ses ? !!S.ses.admin : false };
  guardar();
}
function quitarSesion() {
  S.ses = null; S.mios = S.mios.filter(esLocal); S.gamas = S.gamas.filter(esLocal);
  if (!buscarGama(S.gamaActiva)) S.gamaActiva = 'basicos';
  guardar();
}
async function tok() {
  if (!S.ses) return null;
  if (Date.now() > S.ses.exp - 60000) {
    try {
      var r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: S.ses.refresh_token }) });
      if (r.ok) ponerSesion(await r.json()); else if (r.status === 400 || r.status === 401) { quitarSesion(); toast('La sesión ha caducado. Vuelve a entrar.'); }
    } catch (e) {}
  }
  return S.ses ? S.ses.access_token : null;
}
async function api(ruta, opt) {
  opt = opt || {};
  var t = await tok(), h = { apikey: SUPA_KEY, Authorization: 'Bearer ' + (t || SUPA_KEY), 'Content-Type': 'application/json' };
  if (opt.prefer) h.Prefer = opt.prefer;
  var r = await fetch(SUPA_URL + ruta, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
  var txt = await r.text(), j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description)) || ('Error ' + r.status));
  return j;
}
async function cargarNube() {
  if (!NUBE) return;
  try {
    var e = (await api('/rest/v1/esquemas?select=id,nombre,vueltas,colores,publico,owner,tiene_foto&order=creado.desc')).map(limpio);
    var g = (await api('/rest/v1/gamas?select=id,nombre,colores,publico,owner&order=creado.asc')).map(gamaLimpia);
    S.pub = { esquemas: e.filter(function (x) { return x.publico; }), gamas: g.filter(function (x) { return x.publico; }) };
    if (S.ses) {
      S.mios = S.mios.filter(esLocal).concat(e.filter(function (x) { return !x.publico; }));
      S.gamas = S.gamas.filter(esLocal).concat(g.filter(function (x) { return !x.publico; }));
      var p = await api('/rest/v1/perfiles?select=es_admin&id=eq.' + encodeURIComponent(S.ses.uid));
      if (S.ses) S.ses.admin = !!(p && p[0] && p[0].es_admin);
    }
    if (!buscarGama(S.gamaActiva)) S.gamaActiva = 'basicos';
    guardar();
    if (V.vista === 'inicio' || V.vista === 'perfil') render();
  } catch (err) { /* sin conexión: se queda con lo último que se cargó */ }
}
// Al entrar con cuenta, lo que estaba solo en el dispositivo se sube a la nube
async function subirLocales() {
  var locales = S.mios.filter(esLocal);
  for (var i = 0; i < locales.length; i++) {
    var e = locales[i], f = await fotoLeer(e.id);
    var r = await api('/rest/v1/esquemas?select=id', { method: 'POST', prefer: 'return=representation', body: { nombre: e.nombre, vueltas: e.vueltas, colores: e.colores, publico: false, foto: okFoto(f) ? f : null } });
    var nid = r[0].id;
    if (S.combos[e.id]) { S.combos[nid] = S.combos[e.id]; delete S.combos[e.id]; }
    if (S.ultimo[e.id]) { S.ultimo[nid] = S.ultimo[e.id]; delete S.ultimo[e.id]; }
    await fotoBorrar(e.id);
    S.mios = S.mios.filter(function (x) { return x.id !== e.id; }); guardar();
  }
  var gl = S.gamas.filter(esLocal);
  for (var k = 0; k < gl.length; k++) {
    var g = gl[k], rg = await api('/rest/v1/gamas?select=id', { method: 'POST', prefer: 'return=representation', body: { nombre: g.nombre, colores: g.colores, publico: false } });
    if (S.gamaActiva === g.id) S.gamaActiva = rg[0].id;
    S.gamas = S.gamas.filter(function (x) { return x.id !== g.id; }); guardar();
  }
}

// ---- Consultas ----
function biblioteca() { return NUBE && S.pub.esquemas.length ? S.pub.esquemas : INCLUIDOS.map(limpio); }
function buscar(id) {
  var todos = INCLUIDOS.map(limpio).concat(S.pub.esquemas, S.mios);
  for (var i = 0; i < todos.length; i++) if (todos[i].id === id) return todos[i];
  return null;
}
function esAdmin() { return !!(NUBE && S.ses && S.ses.admin); }
function puedeEditar(e) { if (String(e.id).indexOf('inc-') === 0) return false; return e.publico ? esAdmin() : true; }
function todasGamas() { return GAMAS_FIJAS.concat(S.pub.gamas, S.gamas); }
function buscarGama(id) { var t = todasGamas(); for (var i = 0; i < t.length; i++) if (t[i].id === id) return t[i]; return null; }
function gamaAct() { return buscarGama(S.gamaActiva) || GAMAS_FIJAS[0]; }
function nombreColor(c) {
  var t = [gamaAct()].concat(todasGamas());
  for (var i = 0; i < t.length; i++) for (var k = 0; k < t[i].colores.length; k++) if (t[i].colores[k][1] === c) return t[i].colores[k][0];
  return 'Color a mano';
}
function ajustar(cols, e) { return e.vueltas.map(function (_, i) { return okHex(cols && cols[i]) ? cols[i] : e.colores[i]; }); }
function actuales() {
  if (V.vista === 'editar') return V.ed.vueltas;
  var e = buscar(V.id); return e ? e.vueltas.map(function (t, i) { return { tipo: t, color: V.cols[i] }; }) : [];
}
function ponerColor(i, c) {
  if (!okHex(c) || i < 0) return;
  c = c.toLowerCase();
  if (V.vista === 'editar') { V.ed.vueltas[i].color = c; V.ed.sucio = true; }
  else { V.cols[i] = c; S.ultimo[V.id] = V.cols.slice(); guardar(); }
}
async function fotoDe(e) {
  if (!e.tiene_foto) return null;
  if (FOTOS[e.id]) return FOTOS[e.id];
  var f = null;
  if (esLocal(e)) f = await fotoLeer(e.id);
  else if (NUBE) { try { var r = await api('/rest/v1/esquemas?select=foto&id=eq.' + encodeURIComponent(e.id)); f = r && r[0] && r[0].foto; } catch (err) { f = null; } }
  if (okFoto(f)) { FOTOS[e.id] = f; return f; }
  return null;
}

// ---- Piezas de pantalla ----
function dibujo(vs) { return dibujarGranny(generar(vs.map(function (v) { return v.tipo; })), vs.map(function (v) { return v.color; })); }
function chipsGamas() {
  var G = gamaAct(), mia = !GAMAS_FIJAS.some(function (g) { return g.id === G.id; }) && (G.publico ? esAdmin() : true);
  return '<h2>Gama de colores</h2><div class="chips">' + todasGamas().map(function (g) {
    return '<button data-act="gama" data-id="' + esc(g.id) + '" aria-pressed="' + (g.id === G.id) + '">' + esc(g.nombre) + ' · ' + g.colores.length + '</button>';
  }).join('') + '<button class="mas" data-act="nuevagama">+ Añadir gama</button></div>' +
    (G.nota || mia ? '<p class="nota">' + esc(G.nota || 'Tonos aproximados, sacados de una foto.') + (mia ? ' <button data-act="pedirborrargama">Eliminar esta gama</button>' : '') + '</p>' : '');
}
function filas(vs, editable) {
  var G = gamaAct();
  return '<ul class="lista">' + vs.map(function (v, i) {
    var s = '<li class="fila' + (i === V.sel ? ' sel' : '') + '"><button class="cab" data-act="sel" data-i="' + i + '" aria-expanded="' + (i === V.sel) + '">' +
      '<i style="background:' + v.color + '"></i><span><b>Vuelta ' + (i + 1) + ' · ' + esc(TIPO[v.tipo].nombre) + '</b>' + esc(nombreColor(v.color)) + '</span>' + (editable ? icono(v.tipo) : '') + '</button>';
    if (i === V.sel) {
      s += '<div class="det"><div class="paleta">' + G.colores.map(function (h) {
        return '<button data-act="color" data-c="' + h[1] + '" title="' + esc(h[0]) + '" aria-label="' + esc(h[0]) + '" aria-pressed="' + (h[1] === v.color) + '" style="background:' + h[1] + '"></button>';
      }).join('') + '</div><label class="otro"><input type="color" data-campo="otro" value="' + v.color + '"> Otro color a mano</label>' +
        (editable ? '<div class="mini2"><button data-act="cambiartipo" data-i="' + i + '">Cambiar tipo</button><button data-act="quitarvuelta" data-i="' + i + '">Quitar vuelta</button></div>' : '') + '</div>';
    }
    return s + '</li>';
  }).join('') + '</ul>';
}
function tarjeta(e) {
  var cols = ajustar(S.ultimo[e.id], e);
  return '<button class="tarjeta" data-act="abrir" data-id="' + esc(e.id) + '"><div class="mini">' + dibujarGranny(generar(e.vueltas), cols) + '</div><b>' + esc(e.nombre) + '</b><small>' +
    e.vueltas.length + ' vueltas' + (esLocal(e) ? ' · solo en este móvil' : '') + '</small></button>';
}

function vistaInicio() {
  var bib = biblioteca();
  return '<h1>Grannys</h1><p class="sub">Elige un granny, mira cómo queda tejido y prueba colores vuelta a vuelta.</p>' +
    '<h2>Biblioteca</h2><div class="rejilla">' + bib.map(tarjeta).join('') + '</div>' +
    '<h2>Mis esquemas</h2><div class="rejilla">' + S.mios.map(tarjeta).join('') +
    '<button class="tarjeta nueva" data-act="nuevo"><span>+</span>Nuevo esquema</button></div>' +
    (esAdmin() ? '<p class="nota">Eres administradora: al guardar un esquema puedes ponerlo en la biblioteca para todas.</p>' : '');
}
function vistaVer() {
  var e = buscar(V.id); if (!e) { V.vista = 'inicio'; return vistaInicio(); }
  var vs = actuales(), cb = S.combos[e.id] || [];
  return '<div class="barra"><button data-act="volver">‹ Volver</button><strong>' + esc(e.nombre) + '</strong>' + (puedeEditar(e) ? '<button data-act="editar">Editar</button>' : '') + '</div>' +
    '<div class="visor"><div id="lienzo">' + dibujo(vs) + '</div></div>' +
    '<div class="acc"><button data-act="azar">Colores al azar</button><button data-act="original">Colores del esquema</button></div>' +
    chipsGamas() + '<h2>Vueltas · toca una para cambiarle el color</h2>' + filas(vs, false) +
    '<button class="grande" data-act="guardarcombo">Guardar esta combinación</button>' +
    (cb.length ? '<h2>Mis combinaciones</h2><div class="combos">' + cb.map(function (c, i) {
      return '<div class="combo"><button class="tira" data-act="usarcombo" data-i="' + i + '" aria-label="Usar la combinación ' + (i + 1) + '">' +
        ajustar(c, e).map(function (x) { return '<i style="background:' + x + '"></i>'; }).join('') + '</button><button class="x" data-act="borrarcombo" data-i="' + i + '" aria-label="Borrar la combinación ' + (i + 1) + '">✕</button></div>';
    }).join('') + '</div>' : '') +
    (e.tiene_foto ? '<button class="grande sec" data-act="verfoto">Ver el esquema original</button>' : '');
}
function vistaEditar() {
  var d = V.ed;
  return '<div class="barra"><button data-act="cancelar">✕ Cancelar</button><strong>' + (d.id ? 'Editar esquema' : 'Nuevo esquema') + '</strong></div>' +
    '<label class="campo" for="nom">Nombre</label><input type="text" id="nom" data-campo="nombre" maxlength="80" value="' + esc(d.nombre) + '" placeholder="Por ejemplo: Granny girasol">' +
    '<label class="campo">Foto del esquema (opcional, para tenerlo a mano al tejer)</label>' +
    (d.foto ? '<img class="fotoesq" src="' + d.foto + '" alt="Foto del esquema">' : (d.cargandoFoto ? '<p class="nota">Cargando la foto…</p>' : '')) +
    '<input type="file" accept="image/*" data-campo="fotoesq" aria-label="Elegir foto del esquema">' +
    (d.foto ? '<p class="nota"><button data-act="quitarfoto">Quitar la foto</button></p>' : '') +
    '<div class="visor"><div id="lienzo">' + dibujo(d.vueltas) + '</div></div>' +
    '<h2>Vueltas</h2>' + (d.vueltas.length ? filas(d.vueltas, true) : '<p class="vacio">Mira el esquema y di cómo es cada vuelta, empezando por la que sale del anillo. La app calcula los puntos.</p>') +
    '<button class="grande sec" data-act="nuevavuelta">+ Añadir vuelta</button>' +
    (d.vueltas.length ? chipsGamas() : '') +
    (esAdmin() ? '<label class="marca"><input type="checkbox" data-campo="publico"' + (d.publico ? ' checked' : '') + '><span><b>Ponerlo en la biblioteca</b><br>Lo verán todas las usuarias. No subas esquemas de otros autores sin permiso.</span></label>' : '') +
    '<button class="grande" data-act="guardaresquema"' + (V.ocupado ? ' disabled' : '') + '>' + (V.ocupado ? 'Guardando…' : 'Guardar esquema') + '</button>' +
    (d.id ? '<button class="grande rojo" data-act="pedirborrar">Eliminar esquema</button>' : '');
}
function vistaPerfil() {
  var h = '<h1>Perfil</h1>';
  if (!NUBE) h += '<div class="bloque"><b>Biblioteca compartida</b><p>Todavía no está conectada. De momento los esquemas que crees se guardan solo en este dispositivo.</p></div>';
  else if (S.ses) h += '<div class="bloque"><b>Tu cuenta</b><p>' + esc(S.ses.email) + (S.ses.admin ? ' · administradora' : '') + '</p>' +
    '<div class="acc"><button data-act="salir">Cerrar sesión</button></div><button class="grande rojo" data-act="pedirborrarcuenta">Eliminar mi cuenta</button></div>';
  else h += '<div class="bloque"><b>Tu cuenta</b><p>Con cuenta, tus esquemas y gamas se guardan en la nube y los tienes en cualquier dispositivo. La biblioteca se puede usar sin cuenta.</p>' +
    '<label class="campo" for="em">Correo</label><input type="email" id="em" data-campo="email" autocomplete="email" autocapitalize="off" value="' + esc(CF.email) + '">' +
    '<label class="campo" for="pw">Contraseña (6 caracteres o más)</label><input type="password" id="pw" data-campo="pass" autocomplete="current-password" value="' + esc(CF.pass) + '">' +
    '<div class="acc"><button data-act="entrar"' + (V.ocupado ? ' disabled' : '') + '>Entrar</button><button data-act="crearcuenta"' + (V.ocupado ? ' disabled' : '') + '>Crear cuenta</button></div></div>';
  h += '<div class="bloque"><b>Copia de seguridad</b><p>Guarda en un archivo lo que hay solo en este dispositivo: esquemas sin subir, gamas propias y combinaciones de colores.</p>' +
    '<div class="acc"><button data-act="exportar">Exportar</button><button data-act="importar">Importar</button></div><input type="file" id="imp" accept="application/json,.json" data-campo="importar" hidden></div>';
  return h;
}
function render() {
  var h = V.vista === 'ver' ? vistaVer() : V.vista === 'editar' ? vistaEditar() : V.vista === 'perfil' ? vistaPerfil() : vistaInicio();
  $('app').innerHTML = h;

// Saca los colores principales de una imagen. No es IA: solo cuenta píxeles.
function extraerColores(d, w, h) {

  var cubos = {}, total = 0;

    var k = (c[0] >> 4) + ',' + (c[1] >> 4) + ',' + (c[2] >> 4), b = cubos[k] || (cubos[k] = [0, 0, 0, 0]);

    .filter(function (x) { return x.n > total * 0.006; }).sort(function (a, b) { return b.n - a.n; });
  var fin = [];
  lista.forEach(function (x) { if (fin.length < 60 && fin.every(function (y) { return dist(x.c, y.c) > 38; })) fin.push(x); });

async function acceso(alta) {
  var email = CF.email.trim();
  if (!/^\S+@\S+\.\S+$/.test(email) || CF.pass.length < 6) { toast('Escribe tu correo y una contraseña de 6 caracteres o más'); return; }
  V.ocupado = true; render();
  try {
    var r = await fetch(SUPA_URL + '/auth/v1/' + (alta ? 'signup' : 'token?grant_type=password'), { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: CF.pass }) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('Error ' + r.status));
    if (j.access_token) {
      ponerSesion(j); CF.pass = '';
      try { await subirLocales(); } catch (e) { toast('Has entrado, pero algún esquema no se ha podido subir'); }
      await cargarNube(); toast('Sesión iniciada');
    } else toast('Cuenta creada. Confirma el correo que te ha llegado y luego pulsa Entrar');
  } catch (err) {
    var m = err.message;
    toast(/fetch|network|load/i.test(m) ? 'No se ha podido conectar. Comprueba internet.' : /invalid login/i.test(m) ? 'Correo o contraseña incorrectos' :
      /not confirmed/i.test(m) ? 'Antes tienes que confirmar el correo que te enviamos' : /already registered/i.test(m) ? 'Ya hay una cuenta con ese correo' : m);
  }
  V.ocupado = false; render();
}
async function importarArchivo(archivo) {
  try {
    var j = JSON.parse(await archivo.text());
    if (!j || j.app !== 'grannys') throw new Error('no es una copia de Grannys');
    var n = 0;
    (Array.isArray(j.mios) ? j.mios : []).slice(0, 300).forEach(function (e) {
      var id = String(e.id); if (id.indexOf('loc-') !== 0) return;
      var o = limpio(e), f = j.fotos && j.fotos[id]; o.tiene_foto = okFoto(f) && f.length < 600000;
      if (o.tiene_foto) fotoPoner(id, f);
      S.mios = S.mios.filter(function (x) { return x.id !== id; }); S.mios.push(o); n++;
    });
    (Array.isArray(j.gamas) ? j.gamas : []).slice(0, 100).forEach(function (g) {
      var id = String(g.id); if (id.indexOf('loc-') !== 0) return;
      S.gamas = S.gamas.filter(function (x) { return x.id !== id; }); S.gamas.push(gamaLimpia(g));
    });
    ['combos', 'ultimo'].forEach(function (k) {
      var o = j[k]; if (!o || typeof o !== 'object') return;
      Object.keys(o).slice(0, 500).forEach(function (id) {
        if (k === 'ultimo') { if (Array.isArray(o[id]) && o[id].every(okHex)) S.ultimo[id] = o[id].slice(0, 30); }
        else if (Array.isArray(o[id])) S.combos[id] = o[id].filter(function (c) { return Array.isArray(c) && c.every(okHex); }).slice(0, 20);
      });
    });
    guardar(); render(); toast('Copia importada: ' + n + ' esquemas');
  } catch (err) { toast('No se ha podido importar: ' + err.message); }
}

  }
  else if (c === 'fotogama' && a) leerImagen(a).then(cargarFotoGama).catch(function () { $('fotozona').innerHTML = '<p class="aviso">No he podido abrir esa imagen. Prueba con una captura de pantalla.</p>'; });
  else if (c === 'importar' && a) { importarArchivo(a); e.target.value = ''; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && V.hoja) cerrar(); });

S.mios = S.mios.map(limpio); S.gamas = S.gamas.map(gamaLimpia);
S.pub = { esquemas: (S.pub.esquemas || []).map(limpio), gamas: (S.pub.gamas || []).map(gamaLimpia) };
if (!buscarGama(S.gamaActiva)) S.gamaActiva = 'basicos';
render();
cargarNube();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
