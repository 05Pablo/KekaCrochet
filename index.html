<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grannys</title>
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grannys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--fondo:#f6efe4;--tinta:#3b2f2a;--suave:#8a7a70;--tarjeta:#fffaf2;--borde:#e4d8c6;--acento:#c8553d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font:italic 1.6rem Georgia,'Times New Roman',serif;margin:6px 0 2px}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:20px 0 8px}
p{line-height:1.45}
.sub,.vacio{color:var(--suave);font-size:.9rem;margin:0 0 6px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.barra{display:flex;align-items:center;gap:8px;min-height:44px}
.barra strong{flex:1;min-width:0;font:italic 1.25rem Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra button{flex:none;background:none;border:0;font-size:.92rem;font-weight:700;color:var(--acento);padding:10px 6px}
.rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tarjeta{background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:16px;padding:10px;text-align:left;display:block;width:100%}
.tarjeta .mini{line-height:0;margin-bottom:8px}
.tarjeta svg{display:block;width:100%;height:auto}
.tarjeta b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta small{color:var(--suave);font-size:.78rem}
.tarjeta.nueva{border-style:dashed;border-color:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;font-weight:700;gap:6px;text-align:center}
.tarjeta.nueva span{font-size:1.8rem;line-height:1}
.visor{position:sticky;top:0;z-index:2;background:var(--fondo);padding:8px 0 10px}
#lienzo{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:10px;line-height:0;width:min(100%,42vh);margin:0 auto}
#lienzo svg{display:block;width:100%;height:auto}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fila{background:var(--tarjeta);border:2px solid var(--borde);border-radius:14px;overflow:hidden}
.fila.sel{border-color:var(--acento)}
.cab{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;text-align:left;font-size:.9rem}
.cab i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.cab span{flex:1;min-width:0;color:var(--suave)}
.cab b{display:block;color:var(--tinta);font-size:.9rem}
.cab svg{flex:none;color:var(--suave)}
.det{padding:2px 12px 12px}
.paleta{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.paleta button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0}
.paleta button[aria-pressed=true]{outline:3px solid var(--acento);outline-offset:2px}
.otro{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;margin-top:10px}
.otro input{width:38px;height:30px;padding:0;border:1px solid var(--borde);border-radius:8px;background:none}
.mini2,.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mini2 button,.acc button{flex:1;font-size:.84rem;font-weight:600;background:none;border:1.5px solid var(--tinta);border-radius:999px;padding:9px 12px;white-space:nowrap}
.mini2 button{border-color:var(--borde)}
.grande{display:block;width:100%;margin-top:12px;font-size:1rem;font-weight:700;background:var(--acento);color:#fff;border:0;border-radius:14px;padding:14px}
.grande.sec{background:none;color:var(--tinta);border:1.5px solid var(--tinta)}
.grande.rojo{background:none;color:#a3261d;border:1.5px solid #a3261d}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.chips button{flex:none;font-size:.84rem;font-weight:600;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:999px;padding:8px 13px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.chips button.mas{border-style:dashed;border-color:var(--tinta)}
.nota{font-size:.82rem;color:var(--suave);margin:4px 2px 0}
.nota button{background:none;border:0;padding:0;font-size:inherit;color:var(--acento);font-weight:700;text-decoration:underline}
.combos{display:grid;gap:6px}
.combo{display:flex;align-items:center;gap:8px;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:12px;padding:4px 4px 4px 10px}
.combo .tira{flex:1;display:flex;gap:4px;flex-wrap:wrap;background:none;border:0;padding:8px 0}
.tira i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.combo .x{flex:none;background:none;border:0;font-size:1rem;padding:10px;color:var(--suave)}
.bloque{background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:10px}
.bloque b{display:block;margin-bottom:4px}
.bloque p{margin:0 0 10px;font-size:.86rem;color:var(--suave)}
label.campo{display:block;font-size:.8rem;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--tinta)}
input[type=file]{max-width:100%;font-size:.86rem;margin-top:6px}
.marca{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin-top:14px}
.marca input{width:22px;height:22px;flex:none;margin:0}
.fotoesq{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--borde);margin:6px 0}
.aviso{font-size:.86rem;background:#fdeacc;border-radius:10px;padding:10px;margin:8px 0 0}
#velo{position:fixed;inset:0;background:rgba(40,28,22,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#velo[hidden]{display:none}
#hoja{background:var(--fondo);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom))}
.tipos{display:grid;gap:8px}
.tipos button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:14px;padding:10px 12px}
.tipos button svg{flex:none}
.tipos b{display:block;font-size:.95rem}
.tipos small{color:var(--suave);font-size:.8rem}
#foto{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--borde);margin:8px 0;touch-action:manipulation;cursor:crosshair}
#hoja img.orig{display:block;width:100%;height:auto;border-radius:10px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--tarjeta);border-top:1px solid var(--borde);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav[hidden]{display:none}
#nav button{flex:1;max-width:280px;background:none;border:0;padding:14px 8px;font-size:.9rem;font-weight:700;color:var(--suave)}
#nav button[aria-current=page]{color:var(--acento)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:88vw;text-align:center}
#toast[hidden]{display:none}
.seg{display:flex;background:var(--borde);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:.88rem;font-weight:700;color:var(--suave)}
.seg button[aria-pressed=true]{background:var(--tarjeta);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.visor{position:sticky;top:0;z-index:2;background:var(--fondo);padding:8px 0}
#lienzo{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:8px;line-height:0;width:min(100%,40vh);margin:0 auto 8px}
#lienzo svg{display:block;width:100%;height:auto}
#lienzo .pt{cursor:pointer}
#lienzo .selx{filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 0 3px rgba(200,85,61,.9))}
.visor .seg{max-width:260px;margin:0 auto}
.visor .seg button{padding:6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;align-items:center}
.chips button{flex:none;min-width:42px;font-size:.88rem;font-weight:700;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:999px;padding:8px 13px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.chips button.mas{border-style:dashed;border-color:var(--tinta)}
.tarj{background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:16px;padding:12px}
.tarj h3{margin:0 0 2px;font:italic 1.2rem Georgia,serif}
.blo{border:1.5px solid var(--borde);border-radius:12px;margin-top:8px;background:#fff}
.blo.sel{border-color:var(--acento)}
.blo .fila{display:flex;align-items:center;gap:6px;padding:6px}
.paso{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--borde);background:var(--tarjeta);font-size:1.2rem;font-weight:700;flex:none;padding:0}
.num{width:54px;height:38px;text-align:center;font:inherit;font-size:16px;font-weight:700;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--tinta);flex:none;padding:0}
.blo .que{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:none;border:0;text-align:left;font-size:.9rem;font-weight:600;padding:4px 2px}
.blo .que svg{flex:none}
.blo .ops{padding:2px 8px 10px;display:grid;gap:8px}
.marca{display:flex;gap:8px;align-items:center;font-size:.86rem}
.marca input{width:20px;height:20px;margin:0;flex:none}
.mini{display:flex;gap:6px}
.mini button{flex:1;font-size:.8rem;font-weight:600;background:none;border:1.5px solid var(--borde);border-radius:999px;padding:7px 4px}
.puntos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.puntos button{background:#fff;border:1.5px solid var(--borde);border-radius:12px;padding:4px 2px 6px;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.rep{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;font-weight:600;flex-wrap:wrap}
.resumen{background:var(--fondo);border-radius:10px;padding:8px 10px;font-size:.88rem;margin-top:10px}
.grande{display:block;width:100%;margin-top:12px;font-size:1rem;font-weight:700;background:var(--acento);color:#fff;border:0;border-radius:14px;padding:14px}
.enl{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.enl button{background:none;border:0;padding:4px 0;font-size:.86rem;font-weight:700;color:var(--acento);text-decoration:underline}
.paleta{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.paleta button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0}
.paleta button[aria-pressed=true]{outline:3px solid var(--acento);outline-offset:2px}
.hex{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;font-size:.88rem;font-weight:600}
.hex input[type=text]{width:108px;font:inherit;font-size:16px;padding:8px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--tinta)}
.hex input[type=color]{width:42px;height:38px;padding:0;border:1.5px solid var(--borde);border-radius:10px;background:none}
.hex button{font-size:.86rem;font-weight:700;background:var(--tinta);color:var(--fondo);border:0;border-radius:999px;padding:9px 14px}
.sel-txt{font-weight:700;margin:8px 0 2px}

.lnk{background:none;border:0;padding:0;font:inherit;color:var(--acento);font-weight:700;text-decoration:underline}
.lin{font-size:.88rem;margin:0 0 6px}
label.campo{display:block;font-size:.8rem;font-weight:700;margin:10px 0 4px}
.codigo{display:flex;gap:8px;align-items:center}
.codigo span{flex:1;font:700 1.4rem ui-monospace,Menlo,monospace;letter-spacing:.14em;background:#fff;border:1.5px solid var(--borde);border-radius:10px;padding:8px 12px;text-align:center}
.codigo input{flex:1;min-width:0}
.codigo button,.persona button{flex:none;font-size:.86rem;font-weight:700;background:var(--tinta);color:var(--fondo);border:1.5px solid var(--tinta);border-radius:999px;padding:9px 14px}
.persona{display:flex;align-items:center;gap:8px;background:var(--tarjeta);border:1.5px solid var(--borde);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:8px}
.persona span{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persona button.sec{background:none;color:var(--tinta)}
#nav button{max-width:200px}
.grande.sec{background:none;color:var(--tinta);border:1.5px solid var(--tinta)}

.bienvenida{text-align:center;padding:18px 0 14px}
.bienvenida img{border-radius:22px;display:block;margin:0 auto 6px}
.bienvenida h1{font-size:2rem}

.iniciofila{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.82rem;color:var(--suave)}
.iniciofila span{flex:1}
.iniciofila button{flex:none;font-size:.82rem;font-weight:700;background:none;border:1.5px solid var(--acento);color:var(--acento);border-radius:999px;padding:7px 12px}
.punto-ini{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acento);margin-right:6px}

*{touch-action:manipulation}
#lienzo .aqui{filter:drop-shadow(0 0 2px #ff2e93) drop-shadow(0 0 4px rgba(255,46,147,.6))}
.punto-ini{background:#ff2e93}
.marc{width:22px;height:22px;flex:none;margin:0 2px 0 0}
.blo .paso{width:34px;height:36px}.blo .num{width:46px;height:36px}
.grupo{border:2px dashed var(--acento);border-radius:14px;padding:4px 6px 8px;margin-top:10px;background:rgba(200,85,61,.05)}
.gcab{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.84rem;padding:6px 2px 0}
.gcab .paso{width:32px;height:32px}.gcab .num{width:44px;height:32px}
.gcab .lnk{margin-left:auto;font-size:.82rem}
.barsel{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--tinta);color:var(--fondo);border-radius:12px;padding:8px 8px 8px 14px;font-size:.88rem;font-weight:600}
.barsel span{flex:1}
.barsel button{flex:none;font-size:.86rem;font-weight:700;background:var(--acento);color:#fff;border:0;border-radius:999px;padding:9px 14px}
.bienvenida .logo{mix-blend-mode:multiply;border-radius:0;margin-bottom:-6px}
#portada{position:fixed;inset:0;z-index:50;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#portada.fuera{opacity:0;pointer-events:none}
#portada svg{width:min(78vw,340px);height:auto;overflow:visible}
#portada .guino,#portada .estrella{opacity:0}
#portada.anima svg{animation:pop .5s ease-out both}
#portada.anima .guino{animation:guino 2.3s linear both}
#portada.anima .estrella{transform-box:fill-box;transform-origin:center;animation:estrella 2.3s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes guino{0%,38%{opacity:0}40%,58%{opacity:1}60%,100%{opacity:0}}
@keyframes estrella{0%,40%{opacity:0;transform:translate(0,0) scale(.2) rotate(0deg)}46%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(96px,-64px) scale(1.25) rotate(200deg)}}

.blo .extra{padding:0 8px 8px 36px;display:grid;gap:6px}
.blo .extra .marca{font-size:.82rem}

#lienzo .zona{filter:drop-shadow(0 0 2px #0a84ff) drop-shadow(0 0 4px rgba(10,132,255,.7))}
.grupo.azul{border-color:#0a84ff;background:rgba(10,132,255,.05)}
.barsel.azul{background:#0a5fc2}
.barsel.azul button{background:#fff;color:#0a5fc2}
.avatar{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#fff;border:1.5px solid var(--borde);line-height:0}
.avatar svg{width:100%;height:100%;display:block}
.avatar.letra{background:var(--borde);color:var(--tinta);font-weight:700;line-height:1}
.fotofila{display:flex;align-items:center;gap:14px}
.fotofila>div{flex:1}
#portada svg{width:min(96vw,60vh,620px)}

.avatar{border-width:1px}
.fotofila .avatar{border-width:1.5px}

.avatar{border-radius:30%}
.avatar.letra{border-radius:50%}
.persona .avatar{flex:none;min-width:0}
.persona span.avatar+span{flex:1}
</style>
</head>

    V.ocupado = true; render();
    try {
      var r = await api('/rest/v1/rpc/pedir_amistad', { method: 'POST', body: { cod: c } });
      var m = { ok: 'Solicitud enviada', no_existe: 'No hay nadie con ese código', tu_misma: 'Ese es tu propio código', ya: 'Ya sois amigas o hay una solicitud pendiente' }[r] || 'Solicitud enviada';
      if (r === 'ok') CF.cod = ''; toast(m); await cargarNube();
    } catch (e) { toast(errTxt(e)); }
    V.ocupado = false; render();
  },
  aceptar: async function (d) { try { await api('/rest/v1/amistades?id=eq.' + encodeURIComponent(d.id), { method: 'PATCH', body: { estado: 'aceptada' } }); await cargarNube(); toast('Ya sois amigas'); } catch (e) { toast(errTxt(e)); } },
  pedirquitar: function (d) { confirmar('¿Quitar a esta amiga?', 'Dejaréis de ver los diseños que os hayáis compartido.', 'quitaramiga', 'Quitar', d.id); },
  quitaramiga: async function (d) { cerrar(); try { await api('/rest/v1/amistades?id=eq.' + encodeURIComponent(d.id), { method: 'DELETE' }); await cargarNube(); } catch (e) { toast(errTxt(e)); } },
  entrar: function () { return acceso(false); }, crearcuenta: function () { return acceso(true); },
  elegiravatar: function () {
    var m = mios().filter(function (d) { return d.vueltas.length; });
    hoja('Elige tu foto de perfil', m.length ? '<div class="rejilla">' + m.map(function (d) { return '<button class="tarjeta" data-act="ponavatar" data-id="' + esc(d.id) + '"><div class="mini">' + dibujar(d.vueltas, 'tej', null) + '</div><b>' + esc(d.nombre) + '</b></button>'; }).join('') + '</div>' : '<p>Todavía no tienes diseños guardados. Crea uno y vuelve aquí.</p>');
  },
  ponavatar: async function (d) {
    var x = buscar(d.id); if (!x) return; cerrar();
    try { await api('/rest/v1/perfiles?id=eq.' + encodeURIComponent(yo()), { method: 'PATCH', body: { avatar: { vueltas: sanear(x.vueltas).slice(0, 14) } } }); await cargarNube(); render(); toast('Foto de perfil cambiada'); }
    catch (e) { toast(/avatar|column|permission/i.test(e.message) ? 'Falta ejecutar en Supabase el SQL nuevo de la foto de perfil' : errTxt(e)); }
  },
  quitaravatar: async function () { try { await api('/rest/v1/perfiles?id=eq.' + encodeURIComponent(yo()), { method: 'PATCH', body: { avatar: null } }); await cargarNube(); render(); } catch (e) { toast(errTxt(e)); } },
  guardarnombre: async function () {
    var n = CF.nombre.trim().slice(0, 40); if (!n) { toast('Escribe tu nombre'); return; }
    try { await api('/rest/v1/perfiles?id=eq.' + encodeURIComponent(yo()), { method: 'PATCH', body: { nombre: n } }); CF.nombre = ''; await cargarNube(); toast('Nombre guardado'); } catch (e) { toast(errTxt(e)); }
  },
  salir: async function () { try { await api('/auth/v1/logout', { method: 'POST' }); } catch (e) {} quitarSesion(); render(); toast('Sesión cerrada'); cargarNube(); },
  pedirborrarcuenta: function () { confirmar('¿Eliminar tu cuenta?', 'Se borrarán tu cuenta, tus diseños de la nube y tus amistades. No se puede deshacer.', 'borrarcuenta', 'Eliminar mi cuenta'); },
  borrarcuenta: async function () { cerrar(); try { await api('/rest/v1/rpc/eliminar_mi_cuenta', { method: 'POST', body: {} }); quitarSesion(); render(); toast('Cuenta eliminada'); cargarNube(); } catch (e) { toast('No se ha podido eliminar la cuenta: ' + errTxt(e)); } }
};
async function acceso(alta) {
  var email = CF.email.trim(), nombre = CF.nombre.trim().slice(0, 40);
  if (!/^\S+@\S+\.\S+$/.test(email) || CF.pass.length < 6) { toast('Escribe tu correo y una contraseña de 6 caracteres o más'); return; }
  if (alta && !nombre) { toast('Escribe tu nombre para crear la cuenta'); return; }
  V.ocupado = true; render();
  try {
    var cuerpo = { email: email, password: CF.pass }; if (alta) cuerpo.data = { nombre: nombre };
    var r = await fetch(SUPA_URL + '/auth/v1/' + (alta ? 'signup' : 'token?grant_type=password'), { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('Error ' + r.status));
    if (j.access_token) { ponerSesion(j); CF.pass = ''; CF.nombre = ''; CF.aviso = ''; V.vista = 'inicio'; V.d = null; await trasEntrar(); toast('Sesión iniciada'); }
    else { CF.modo = 'entrar'; CF.pass = ''; CF.aviso = 'Cuenta creada. Te hemos enviado un correo: pulsa el enlace para confirmarla y entrarás directamente.'; }
  } catch (err) {
    var m = errTxt(err);
    toast(/invalid login/i.test(m) ? 'Correo o contraseña incorrectos' : /not confirmed/i.test(m) ? 'Antes tienes que confirmar el correo que te enviamos' : /already registered/i.test(m) ? 'Ya hay una cuenta con ese correo' : m);
  }
  V.ocupado = false; render();
}
async function trasEntrar() {
  try { await subirLocales(); } catch (e) { toast('Has entrado, pero algún diseño no se ha podido subir'); }
  await cargarNube();
}
// Al volver del enlace del correo de confirmación, Supabase deja la sesión en la dirección
async function sesionDeEnlace() {
  var h = location.hash || ''; if (h.indexOf('access_token=') < 0) return;
  var p = new URLSearchParams(h.slice(1)), at = p.get('access_token'), rt = p.get('refresh_token');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!at || !rt || !NUBE) return;
  try {
    var r = await fetch(SUPA_URL + '/auth/v1/user', { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + at } });
    if (!r.ok) return; var u = await r.json(); if (!u || !u.id) return;
    ponerSesion({ access_token: at, refresh_token: rt, expires_in: +p.get('expires_in') || 3600, user: u }); V.vista = 'inicio'; await trasEntrar(); render(); toast('Cuenta confirmada. Ya has entrado.');
  } catch (e) {}
}

document.addEventListener('click', function (e) {
  if (e.target.id === 'velo') { cerrar(); return; }
  var p = e.target.closest && e.target.closest('#lienzo .pt');
  if (p && V.vista === 'diseno' && !V.ro) {
    if (U.zsel && U.tab === 'esq') {
      var sz = parseFloat(p.dataset.s);
      if (+p.dataset.v !== U.v - 1 || !isFinite(sz)) { toast('Toca un punto de la vuelta ' + U.v + ', la anterior a esta'); return; }
      if (U.zsel.fase === 1) { U.zsel = { fase: 2, s: sz }; render(); return; }
      var sA = U.zsel.s, sB = sz, del = (((sA - sB) % 4) + 4) % 4; if (del > 2) { var tmp = sA; sA = sB; sB = tmp; del = 4 - del; }
      var nIt = calcular(VS())[U.v - 1].items.filter(function (it) { return enZona({ s0: sA + 1e-4, s1: sA - del - 1e-4 }, it.s); }).length, mg = nIt > 1 ? del / (nIt - 1) / 2 : 0.07;
      var zid = Math.random().toString(36).slice(2, 7).replace(/[^a-z0-9]/g, 'a') || 'z', vz = vu(); vz.zonas = vz.zonas || {}; vz.zonas[zid] = { s0: sA + mg, s1: sA - del - mg };
      U.zact = zid; U.zsel = null; V.sucio = true; render(); return;
    }
    if (U.eligeIni && U.tab === 'esq') { var si = parseFloat(p.dataset.s); if (isFinite(si)) { vu().ini = ((si % 4) + 4) % 4; V.sucio = true; } U.eligeIni = false; render(); return; }
    U.v = +p.dataset.v;
    if (U.tab === 'esq') U.b = +p.dataset.b; else { U.cb = +p.dataset.b; U.ck = U.modo === 'punto' ? +p.dataset.k : null; }
    render(); return;
  }
  var b = e.target.closest && e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset);
});
document.addEventListener('input', function (e) {
  var c = e.target.dataset && e.target.dataset.campo;
  if (c === 'nombre' && V.d) { V.d.nombre = e.target.value; V.sucio = true; }
  else if (c === 'vnombre' && V.d && vu()) { vu().nombre = e.target.value.slice(0, 40); V.sucio = true; }
  else if (c === 'email') CF.email = e.target.value; else if (c === 'pass') CF.pass = e.target.value;
  else if (c === 'nombreu') CF.nombre = e.target.value; else if (c === 'cod') CF.cod = e.target.value;
});
document.addEventListener('change', function (e) {
  var c = e.target.dataset && e.target.dataset.campo; if (!c || !V.d || V.vista !== 'diseno' || V.ro) return;
  if (c === 'publico') { V.d.publico = e.target.checked; V.sucio = true; return; }
  var v = vu(); if (!v) return;
  if (c === 'n') { v.bloques[+e.target.dataset.i].n = Math.min(200, Math.max(1, parseInt(e.target.value, 10) || 1)); estructura(); }
  else if (c === 'rep') { v.rep = Math.min(200, Math.max(1, parseInt(e.target.value, 10) || 1)); estructura(); }
  else if (c === 'arco') { v.bloques[+e.target.dataset.i].arco = e.target.checked; V.sucio = true; }
  else if (c === 'dentro') { v.bloques[+e.target.dataset.i].dentro = e.target.checked; V.sucio = true; }
  else if (c === 'marc') { if (e.target.checked) U.marc[+e.target.dataset.i] = 1; else delete U.marc[+e.target.dataset.i]; }
  else if (c === 'grep') { v.grupos = v.grupos || {}; v.grupos[e.target.dataset.g] = Math.min(200, Math.max(1, parseInt(e.target.value, 10) || 1)); estructura(); }
  else if (c === 'cerrada') { v.cerrada = e.target.checked; V.sucio = true; }
  else if (c === 'junto') { v.bloques[+e.target.dataset.i].junto = e.target.checked; V.sucio = true; }
  else if (c === 'esq') { v.bloques.forEach(function (b, i) { b.esq = i === +e.target.dataset.i ? e.target.checked : false; }); V.sucio = true; }
  else if (c === 'pick') ponerColor(e.target.value);
  else return;
  render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && V.hoja) cerrar(); if (e.key === 'Enter' && e.target.id === 'hx') ACT.hex(); });

S.locales = (Array.isArray(S.locales) ? S.locales : []).map(function (x) { var d = disenoLimpio(x); return { id: d.id, nombre: d.nombre, vueltas: d.vueltas, mod: d.mod }; }).filter(esLocal);
S.cache = { disenos: (S.cache.disenos || []).map(disenoLimpio), perfiles: S.cache.perfiles || [], amistades: S.cache.amistades || [], compartidos: S.cache.compartidos || [] };
render();
(function () {   // pantalla de arranque: la niña de Keka Crochet guiña un ojo y suelta una estrellita
  var p = $('portada'); if (!p) return;
  var quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('plogo').setAttribute('href', LOGO);
  var fin = function () { if (!p.parentNode) return; p.classList.add('fuera'); setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 450); };
  p.addEventListener('click', fin);
  if (!quieto) p.classList.add('anima');
  setTimeout(fin, quieto ? 1100 : 2300);
})();
sesionDeEnlace().then(cargarNube);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
